name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: xfolio_test
          POSTGRES_PASSWORD: xfolio_test
          POSTGRES_DB: xfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xfolio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      XFOLIO_TEST_DATABASE_URL: postgresql+psycopg://xfolio_test:xfolio_test@127.0.0.1:5432/xfolio_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.21'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Check OpenAPI export
        run: |
          uv run python -m xfolio.api.export_openapi
          git diff --exit-code -- contracts/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
