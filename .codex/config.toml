# 저장소 내부의 파일 수정과 일반 검증은 샌드박스 안에서 진행합니다.
sandbox_mode = "workspace-write"
approval_policy = "on-request"

# 샌드박스 경계를 넘는 요청은 가능한 경우 자동 심사로 처리합니다.
approvals_reviewer = "auto_review"

# Windows 기본 샌드박스의 ACL 갱신 오류를 피하기 위해 검증된 MXC를 사용합니다.
[windows]
sandbox = "mxc"

# Windows 기본 코드 페이지와 관계없이 Python이 UTF-8로 읽고 출력합니다.
[shell_environment_policy]
set = { PYTHONUTF8 = "1", PYTHONIOENCODING = "utf-8" }
