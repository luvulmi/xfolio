[project]
name = "xfolio"
version = "0.1.0"
description = "XFolio stock market briefing agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx",
    "openai",
    "pydantic",
    "pydantic-settings",
]

[project.optional-dependencies]
dashboard = ["streamlit"]

[dependency-groups]
dev = ["pytest", "ruff"]

[project.scripts]
xfolio = "xfolio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xfolio"]

[tool.ruff]
target-version = "py312"
