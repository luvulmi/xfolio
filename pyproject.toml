[project]
name = "xfolio"
version = "0.1.0"
description = "XFolio stock market briefing agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "authlib>=1.3,<2",
    "fastapi>=0.115,<1",
    "httpx",
    "itsdangerous>=2,<3",
    "openai",
    "pandas-market-calendars>=5.5.0",
    "psycopg[binary]>=3.2.9,<4",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy>=2,<3",
    "uvicorn>=0.30,<1",
    "yfinance>=1.7.0",
]

[project.optional-dependencies]
dashboard = ["streamlit[auth]>=1.42,<2"]
cloud = ["psycopg[binary]>=3.2.9,<4", "certifi"]

[dependency-groups]
dev = ["pytest", "ruff"]

[project.scripts]
xfolio = "xfolio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xfolio"]

[tool.ruff]
target-version = "py312"
