# 실제 값은 Streamlit Cloud의 Secrets 설정에 입력합니다. Git에 실제 키를 넣지 마세요.
XFOLIO_DATABASE_URL = "postgresql://ROLE:PASSWORD@HOST/DATABASE?sslmode=verify-full"
XFOLIO_ADMIN_EMAILS = ["operator@example.com"]

[auth]
redirect_uri = "https://YOUR-APP.streamlit.app/oauth2callback"
cookie_secret = "REPLACE_WITH_RANDOM_SECRET"
client_id = "GOOGLE_OIDC_CLIENT_ID"
client_secret = "GOOGLE_OIDC_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
