<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img" aria-labelledby="title desc">
<title id="title">XFolio 목표 기술 구조</title><desc id="desc">데이터 제공처에서 Python worker를 거쳐 X로 발행한다. React 화면과 FastAPI는 PostgreSQL에 승인을 저장하고 worker가 같은 DB를 확인한다. worker, X, 운영 배포는 예정 상태다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs>
<style>text{font-family:'Malgun Gothic','Noto Sans KR',sans-serif;fill:#163047} .title{font-size:30px;font-weight:700} .sub{font-size:19px;fill:#526577} .cardTitle{font-size:24px;font-weight:700} .body{font-size:19px} .small{font-size:17px;fill:#526577}</style>
<rect width="1200" height="665" rx="22" fill="#f4f7fb"/>
<text x="48" y="56" class="title">화면과 worker는 같은 승인 기록을 사용합니다</text>
<text x="48" y="89" class="sub">목표 구조 · 실선 박스: 기반 재사용 / 점선 박스: 새 연결 구현 예정</text>
<rect x="48" y="150" width="280" height="154" rx="16" fill="#e6f3fa" stroke="#75b7d6" stroke-width="2"/>
