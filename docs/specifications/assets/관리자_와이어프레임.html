function draw(){root.innerHTML=views[page]();document.querySelectorAll('nav [data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});if(page==='newsletters')document.getElementById('message').textContent=messages[slot];}
function tell(t){toast.textContent=t;toast.hidden=false;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;draw();}else if(b.dataset.slot){slot=b.dataset.slot;draw();}else if(b.dataset.action==='search'){query=document.getElementById('query').value.trim().toLowerCase();const matches=catalog.filter(x=>x.name.toLowerCase().includes(query)||x.code.toLowerCase().includes(query));const box=document.getElementById('searchResults');box.replaceChildren();matches.forEach(x=>{const row=document.createElement('p');row.textContent=`${x.name} (${x.code}) · ${x.code==='DEMO-A'?'합성 확인 정보':'KRX/KRW · 기본3종 식별 표본'}`;const add=document.createElement('button');add.className='button';add.textContent=watched.some(w=>w.code===x.code)?'등록됨':'확인 후 추가 · 시연';add.disabled=watched.some(w=>w.code===x.code);add.dataset.add=x.code;row.append(add);box.append(row);});if(!matches.length)box.textContent='일치하는 시연 종목이 없습니다.';}else if(b.dataset.add){const x=catalog.find(x=>x.code===b.dataset.add);if(active()>=10)return tell('활성 한도10개입니다.');if(x&&!watched.some(w=>w.code===x.code)){watched.push({...x,active:true});draw();tell('관심 목록 추가 시연 완료 · 실제 DB 저장 없음');}}else if(b.dataset.toggle){const x=watched.find(x=>x.code===b.dataset.toggle);if(!x.active&&active()>=10)return tell('활성 한도10개입니다.');x.active=!x.active;draw();}else if(b.dataset.up){const i=watched.findIndex(x=>x.code===b.dataset.up);if(i>0)[watched[i-1],watched[i]]=[watched[i],watched[i-1]];draw();}else if(b.dataset.action==='save'){intraday=document.getElementById('intraday').checked;close=document.getElementById('close').checked;paused=document.getElementById('paused').checked;tell('설정 저장 시연 완료 · 이 탭에서만 유지');}});
draw();
})();
</script></body></html>
