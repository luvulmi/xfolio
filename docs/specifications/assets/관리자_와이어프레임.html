<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>XFolio 관리자 와이어프레임</title>
<style>
:root{color-scheme:light;--ink:#172b35;--muted:#526571;--line:#dce4e6;--paper:#f3f6f6;--accent:#126a59;--soft:#e5f3ee;--warn:#835409;--bad:#a13d36}
*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,"Malgun Gothic",sans-serif;color:var(--ink);background:var(--paper)}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}a{color:var(--accent)}button:disabled{cursor:not-allowed;opacity:.5}h1,h2,h3,p{margin:0}h1{font-size:29px;letter-spacing:-1px}h2{font-size:18px}h3{font-size:15px}small,.muted{color:var(--muted)}small{font-size:12px}.shell{display:grid;grid-template-columns:214px minmax(0,1fr);min-height:100vh}.sidebar{background:#172f37;color:#e8f2f1;padding:28px 18px;display:flex;flex-direction:column;gap:26px}.brand{font-size:26px;font-weight:700;letter-spacing:-1px}.brand span{color:#7ad3ba}.brand small{display:block;color:#adc5c9;letter-spacing:2px;font-size:10px}.nav{display:grid;gap:7px}.nav button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:none;color:#c4d5d9;border-radius:7px;padding:12px 13px}.nav button.active{background:#31514f;color:white}.nav button em{font-style:normal;font-size:11px;color:#c2cecc}.sidebar-note{margin-top:auto;font-size:12px;color:#b6cbcf}.work{min-width:0}.topbar{padding:18px 30px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.tag{display:inline-block;padding:3px 9px;border-radius:5px;background:#edf1f2;color:#415660;font-size:12px;font-weight:600}.tag.green{color:#135a48;background:var(--soft)}.tag.amber{color:var(--warn);background:#fff1d4}.tag.red{color:var(--bad);background:#fcece9}.tag.dark{color:#e8f2ef;background:#31514f}.prototype{margin:20px 30px 0;padding:10px 14px;border-left:3px solid #b18b43;background:#fcf5e7;font-size:12px;color:#695023}.main{padding:26px 30px 40px;max-width:1400px;margin:auto}.title{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:1.6px;font-weight:700;color:var(--accent);margin-bottom:5px}.title p{margin-top:6px;color:var(--muted);font-size:13px}.button{border:1px solid #c9d5d8;border-radius:6px;background:white;padding:9px 14px;color:var(--ink)}.primary{background:var(--accent);color:white;border-color:var(--accent)}.text-button{padding:0;border:0;background:none;color:var(--accent);text-decoration:underline;text-underline-offset:3px}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-bottom:22px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:9px;padding:21px}.card .value{font-size:28px;font-weight:650;letter-spacing:-.6px;margin:5px 0}.card small{display:block}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:22px}.panel{margin-bottom:20px}.two>.panel{margin-bottom:0}.heading{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:17px}.steps{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}.step{padding:6px 10px;background:#eef2f3;border-radius:5px;font-size:12px;color:#5e6c75}.step.done{color:#245d50;background:#e6f1ed}.step.current{color:white;background:#31514f}.facts{display:flex;gap:24px;flex-wrap:wrap;margin:12px 0}.facts strong{display:block;font-size:14px}.callout{background:#f7f1e7;border-left:3px solid #af8027;padding:12px 14px;margin:13px 0;font-size:13px}.callout.neutral{background:#edf3f4;border-color:#5c7e88}.callout.success{background:var(--soft);border-color:var(--accent)}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}th{color:var(--muted);font-weight:500;background:#f6f8f8}th,td{padding:12px 10px;border-bottom:1px solid #e4e9eb;vertical-align:top}td small{display:block}.filters{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px}label{font-size:12px;font-weight:600;display:grid;gap:5px}input,select,textarea{border:1px solid #cbd6d9;border-radius:5px;background:#fff;padding:8px 10px;color:var(--ink);max-width:100%}textarea{width:100%;min-height:80px;resize:vertical}.review{display:grid;grid-template-columns:minmax(0,1.06fr) minmax(0,1fr);gap:20px}.post{border:1px solid var(--line);padding:20px;border-radius:8px;margin-top:14px}.post-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.avatar{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;background:#e6f1ed;font-weight:700;margin-right:8px}.post p{font-size:16px;line-height:1.9;margin:12px 0}.post .source{font-size:12px;color:var(--muted)}.claim{padding:14px 0;border-bottom:1px solid var(--line)}.claim p{font-size:13px;margin:6px 0}.checklist{list-style:none;padding:0;margin:12px 0;font-size:13px}.checklist li{padding:5px 0}.decision{margin-top:18px;border-top:1px solid var(--line);padding-top:18px}.decision .actions{margin-top:12px}.timeline{list-style:none;padding:0;margin:10px 0}.timeline li{border-left:2px solid #dce8e4;margin-left:6px;padding:0 0 17px 18px}.timeline li strong{display:block}.timeline time{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{border:1px solid var(--line);background:white;padding:8px 14px;border-radius:5px}.tabs button[aria-pressed=true]{background:#31514f;color:white;border-color:#31514f}.empty{padding:26px;text-align:center;color:var(--muted)}.kv{display:grid;grid-template-columns:minmax(100px,.6fr) minmax(0,1fr);gap:0}.kv dt,.kv dd{margin:0;padding:11px 0;border-bottom:1px solid var(--line)}.kv dt{color:var(--muted)}.kv dd{overflow-wrap:anywhere}.toast{margin:0 30px 20px;padding:12px 16px;background:#dff0e9;color:#204d42;border-radius:6px}.footer{padding:14px 30px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}.scenario{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.scenario label{display:flex;align-items:center;gap:8px}.back{margin-bottom:14px}.row-detail{background:#f3f7f6;padding:14px;font-size:13px}.linklike{color:var(--accent);font-size:12px} [hidden]{display:none!important}
@media(max-width:1000px){.shell{grid-template-columns:174px minmax(0,1fr)}.sidebar{padding:23px 12px}.main{padding:22px}.topbar{padding:16px 22px}.prototype{margin:16px 22px 0}.review{grid-template-columns:1fr}.two{grid-template-columns:1fr}.cards{gap:9px}.card{padding:15px}}
@media(max-width:620px){.shell{display:block}.sidebar{padding:16px;gap:14px}.brand{font-size:23px}.brand small,.sidebar-note{display:none}.nav{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.nav button{padding:9px 7px;font-size:12px;gap:3px;flex-wrap:wrap}.topbar,.main{padding:16px}.prototype{margin:14px 16px 0}.cards{grid-template-columns:1fr}.card .value{font-size:24px}.title{display:block}.title>.actions{margin-top:12px}h1{font-size:25px}.panel{padding:15px}.post{padding:14px}.facts{gap:13px}.footer{padding:12px 16px}.toast{margin:0 16px 18px}.kv{grid-template-columns:1fr}.kv dt{border:0;padding-bottom:0}.kv dd{padding-top:3px}.scenario label{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar"><div class="brand">X<span>Folio</span><small>MARKET OPERATIONS</small></div><nav class="nav" aria-label="관리자 메뉴">
<button data-page="dashboard">대시보드 <em>1단계</em></button><button data-page="reviews">콘텐츠 검토 <em>1단계</em></button><button data-page="publications">발행 내역 <em>1단계</em></button><button data-page="collections">수집 현황 <em>후속</em></button><button data-page="operations">운영 현황 <em>후속</em></button><button data-page="settings">설정 <em>후속</em></button></nav><div class="sidebar-note">한 편성의 근거부터<br>발행 결과까지.<br><br>화면 설계 · 2026.10.29</div></aside>
<div class="work"><header class="topbar"><span>운영 작업 공간 <span class="muted">/ 관리자</span></span><div class="actions"><span class="tag">시연 환경</span><span class="tag green">reviewed</span><span class="muted">운영자</span></div></header><div class="prototype">와이어프레임 · 모든 값과 문안은 가상입니다. 승인 버튼도 화면 시연이며 실제 승인·게시·외부 호출은 없습니다. 후속 메뉴는 전체 구조 검토용입니다.</div><main class="main" id="content"></main><div class="toast" id="toast" role="status" hidden></div><footer class="footer">표시 시각 KST · 가상 시연일 2026.11.04 · 실제 제품은 1단계 구현 메뉴부터 노출</footer></div></div>
<script>
(() => {
const root=document.getElementById('content');
const toast=document.getElementById('toast');
let page='dashboard', state='validated', collectionTab='news', operationTab='runs';
const statusNames={validated:'승인 대기',scheduled:'예약됨',held:'보류',unknown:'결과 불명',published:'모의 전송 완료',expired:'만료',error:'최신 조회 실패'};
const stateTone=()=>['validated','held','unknown','expired'].includes(state)?'amber':state==='error'?'red':'green';
const phaseSteps=()=>['수집','생성','검토','예약','발행'].map((name,index)=>{const active=state==='scheduled'?3:state==='published'||state==='unknown'?4:2;return `<span class="step ${index<active?'done':index===active?'current':''}">${name}</span>`;}).join('');
const badge=(text,kind='')=>`<span class="tag ${kind}">${text}</span>`;
const title=(eyebrow,name,description,action='')=>`<div class="title"><div><div class="eyebrow">${eyebrow}</div><h1>${name}</h1><p>${description}</p></div><div class="actions">${action}</div></div>`;
const refresh='<button class="button" data-action="refresh">새로고침</button>';
const move=(target,label)=>`<button class="text-button" data-page="${target}">${label}</button>`;
function notice(text){toast.textContent=text;toast.hidden=false;}
function dashboard(){return title('TODAY AT A GLANCE','오늘의 운영','11월 4일 수요일 · 미국 거래일 11월 3일 · 최종 조회 07:48',refresh)+
`<div class="cards"><section class="card"><small>승인 대기 편성</small><div class="value">${state==='validated'?'1건':state==='error'?'조회 실패':'0건'}</div><small>아침 1편성 · 지수 1글 + 뉴스 1글</small></section><section class="card"><small>아침 발행 목표</small><div class="value">08:00</div><small>신규 전송 마감 09:00 · 상태 ${statusNames[state]}</small></section><section class="card"><small>월 관측 사용액 + 예약</small><div class="value">12,400원</div><small>상한 50,000원 · 가상 앱 원장, 전체 청구액 아님</small></section></div>
<div class="two"><section class="panel"><div class="heading"><h2>아침 브리핑</h2>${badge(statusNames[state],stateTone())}</div><p class="muted">미국 시장 종가와 확인된 새 사실</p><div class="steps">${phaseSteps()}</div><div class="facts"><div><small>정보 기준</small><strong>07:30</strong></div><div><small>현재 버전</small><strong>v3 · 2글</strong></div><div><small>확인 사항</small><strong>${state==='validated'?'코드 검사 통과 · 의미 검토 필요':statusNames[state]+' · 상세 확인'}</strong></div></div><button class="button primary" data-page="review-detail">아침 편성 검토</button></section>
<section class="panel"><div class="heading"><h2>18시 추가 뉴스</h2>${badge('2단계 · 미연결')}</div><p class="muted">낮 수집 → 17:45 동결 → 18:00 발행</p><div class="steps"><span class="step">수집</span><span class="step">선정</span><span class="step">검토</span><span class="step">발행</span></div><div class="callout neutral">이번 30시간은 아침 흐름을 먼저 연결합니다. 저녁 자료가 없다는 이유로 정상 0건이라고 표시하지 않습니다.</div></section></div>
<section class="panel"><div class="heading"><h2>조치가 필요한 상태</h2>${badge('시연 사례 1건','amber')}</div><div class="heading"><div><strong>11/3 아침 · 두 번째 글의 응답을 확인하지 못했습니다</strong><p class="muted">결과 불명 · 자동 재전송 차단 · 원버전·예약 유지</p></div>${move('publication-detail','대조할 결과 보기 →')}</div></section>
<section class="panel"><div class="heading"><h2>최근 발행</h2>${move('publications','전체 내역 →')}</div>${publicationTable()}</section>`;}
function reviewList(){return title('EDITORIAL DESK','콘텐츠 검토','승인할 대상은 기사 한 건이 아닌 편성 전체 버전입니다.',refresh)+
`<section class="panel"><div class="filters"><label>대상일<input type="date" value="2026-11-04" id="review-date"></label><label>편성<select id="review-edition"><option value="all">전체</option><option value="AM">아침</option><option value="PM">저녁</option></select></label><label>상태<select id="review-status"><option value="all">전체</option><option value="validated">승인 대기</option><option value="held">보류</option></select></label><button class="button" data-action="filter">필터 적용</button></div><div id="review-rows">${reviewRows()}</div></section>`;}
function reviewRows(){return `<div class="table-wrap"><table><thead><tr><th>대상일·편성</th><th>버전·구성</th><th>상태</th><th>목표 / 마감</th><th>동작</th></tr></thead><tbody><tr><td>11/4 아침<small>미국 거래일 11/3</small></td><td>v3 · 2글<small>지수 + 뉴스 1건</small></td><td>${badge(statusNames[state],'amber')}<small>코드 검사와 의미 검토 구분</small></td><td>08:00 / 09:00</td><td>${move('review-detail','검토 →')}</td></tr></tbody></table></div>`;}
function reviewDetail(){return `<div class="back">${move('reviews','← 검토 목록')}</div>`+title('EDITION REVIEW','아침 브리핑 · v3','11/4 · 지수 1글 + 뉴스 1글 · 편성 전체 2글',badge(statusNames[state],stateTone()))+
`<div class="scenario"><label>화면 상태 시연<select id="scenario">${Object.entries(statusNames).map(([key,value])=>`<option value="${key}" ${key===state?'selected':''}>${value}</option>`).join('')}</select></label><small>실제 데이터 변경 없음</small></div>
${state==='error'?'<div class="callout" role="alert">최신 상세를 조회하지 못했습니다. 기존 자료는 참고용이며 승인 동작을 차단합니다.</div>':''}
<div class="panel facts"><div><small>정보 기준 / 근거 동결</small><strong>07:30 / 07:43</strong></div><div><small>발행 목표 / 마감</small><strong>08:00 / 09:00</strong></div><div><small>게시 구성</small><strong>지수부터 이어지는 스레드</strong></div></div>
<div class="review"><section class="panel"><div class="heading"><h2>게시 미리보기</h2>${badge('가상 문안')}</div><article class="post"><div class="post-title"><strong><span class="avatar">X</span>XFolio</strong><small>01 · 지수</small></div><p>[시연] 미국 시장 마감<br>S&P 500 · 종가와 등락률<br>Nasdaq-100 · 종가와 등락률</p><div class="source">실제 지수 수치 아님 · 제품에서는 동일 거래일의 두 지수 값·출처 표시</div></article><article class="post"><div class="post-title"><strong><span class="avatar">X</span>XFolio</strong><small>02 · 뉴스</small></div><p>[시연] 기관 A가 반도체 장비의 새 수출 허가 기준을 발표했습니다. 적용일과 예외 조건을 함께 확인해야 합니다.</p><div class="source">가상 출처 E01 · 실제 사건 아님 · 원문 위치와 연결할 자리</div></article><div class="callout neutral">문안 수정은 후속입니다. 잘못된 초안은 보류하며, 수정된 버전에는 새 검증·승인이 필요합니다.</div></section>
<section class="panel"><div class="heading"><h2>근거와 검증</h2>${badge('근거 E01')}</div><article class="claim"><strong>확인할 주장</strong><p>발표 주체: 기관 A / 변화: 허가 기준 / 적용일·예외: 원문 대조</p><small>발행 06:30 · 수집 06:42 · 가상 시각</small></article><article class="claim"><strong>관련성·선정 이유</strong><p>반도체 업종에 적용되는 확정 정책 발표라는 사례. 실제 제품에서는 두 지수 관련 근거와 중요성 판단 이유를 표시합니다.</p></article><ul class="checklist"><li>✓ 시각·필수 필드 검사 <small>시연</small></li><li>✓ 중복·길이 검사 <small>시연</small></li><li>○ 의미·중요성·조건 보존 <strong>운영자 대조</strong></li></ul><div class="decision"><h3>편성 결정</h3><p class="muted">현재 v3의 모든 글을 대상으로 합니다.</p><label for="hold-reason">보류 사유<textarea id="hold-reason" maxlength="300" placeholder="확인하거나 수정할 사항을 적어 주세요."></textarea></label><div class="actions"><button class="button primary" data-action="approve" ${state!=='validated'?'disabled':''}>v3 · 2글 전체 승인</button><button class="button" data-action="hold" ${!['validated','scheduled'].includes(state)?'disabled':''}>${state==='scheduled'?'승인 철회·보류':'보류'}</button></div><p class="muted" style="margin-top:12px">${state==='scheduled'?'예약됨 · 목표 시각에 worker가 조건을 재확인합니다.':state==='held'?'보류된 같은 버전은 재승인할 수 없습니다.':state==='unknown'?'전송 결과 대조가 필요합니다. 새 버전으로 재전송하지 않습니다.':state==='expired'?'마감이 지났습니다. 다음 회차에서 새로 검토합니다.':'승인 전 문안과 근거를 대조하세요.'}</p></div></section></div>`;}
function publicationTable(){return `<div class="table-wrap"><table><thead><tr><th>편성</th><th>결과</th><th>글별 상태</th><th>확인</th></tr></thead><tbody><tr><td>11/3 아침 · v2</td><td>${badge('결과 불명','amber')}</td><td>글1 모의 성공 / 글2 불명<small>가상 송신 결과</small></td><td>${move('publication-detail','상세 →')}</td></tr><tr><td>11/2 아침 · v1</td><td>${badge('모의 완료','green')}</td><td>2/2 모의 성공<small>실제 X 게시 아님</small></td><td>${move('publication-success','상세 →')}</td></tr></tbody></table></div>`;}
function publications(){return title('PUBLICATION HISTORY','발행 내역','승인한 내용과 실제로 확인된 결과를 구분합니다.',refresh)+`<section class="panel">${publicationTable()}</section><div class="callout neutral">결과 불명은 실패와 다릅니다. 응답을 받지 못했어도 게시됐을 수 있어 자동 재전송하지 않습니다.</div>`;}
function publicationDetail(success=false){return `<div class="back">${move('publications','← 발행 내역')}</div>`+title('PUBLICATION DETAIL',success?'11/2 아침 · v1':'11/3 아침 · v2','편성 원버전과 글별 전송 기록을 함께 확인합니다.',badge(success?'모의 완료':'결과 불명',success?'green':'amber'))+
`<div class="two"><section class="panel"><h2>글별 결과</h2><article class="claim"><strong>글 1 · 지수</strong><p>모의 성공 · 08:00:01</p><small>실제 X ID 없음 · 공개 게시 링크 없음</small></article><article class="claim"><strong>글 2 · 뉴스</strong><p>${success?'모의 성공 · 08:00:03':'결과 불명 · 08:00:31 timeout'}</p><small>${success?'실제 X ID 없음':'사건·비용 예약 유지 · 재시도 차단'}</small></article>${success?'<div class="callout success">모의 adapter에서만 완료했습니다. 실제 외부 게시 성공 기록이 아닙니다.</div>':'<div class="callout"><strong>다음 조치</strong><br>원 계정·게시 시각·게시물 ID·스레드 관계를 대조합니다. 조회에 없다는 사실만으로 미전송을 확정하지 않습니다.</div>'}</section>
<section class="panel"><h2>처리 이력</h2><ol class="timeline"><li><time>07:43</time><strong>편성 생성·코드 검사</strong><small>허용 근거·동결 버전</small></li><li><time>07:52</time><strong>운영자 전체 승인</strong><small>정확한 콘텐츠 버전과 결정 revision 기록</small></li><li><time>08:00</time><strong>전송 조건 재확인·점유</strong><small>한도·기한·중복·승인 검사</small></li><li><time>08:00:31</time><strong>${success?'모의 결과 저장':'응답 불명·잔여 전송 중단'}</strong><small>가상 처리 이력</small></li></ol></section></div>`;}
function collections(){return title('SOURCE EXPLORER','수집 현황','후속 · 수집한 자료와 선정 이유를 확인하는 조회 화면입니다.',badge('2단계'))+
`<div class="tabs" aria-label="자료 종류"><button data-collection="news" aria-pressed="${collectionTab==='news'}">뉴스</button><button data-collection="market" aria-pressed="${collectionTab==='market'}">지수</button></div><section class="panel"><div class="heading"><h2>${collectionTab==='news'?'기사와 선정 결과':'지수 수집 기록'}</h2><small>수집 구간 07:00~07:30 · 가상 실행</small></div>${collectionTab==='news'?`<div class="table-wrap"><table><thead><tr><th>자료</th><th>선정</th><th>이유</th></tr></thead><tbody><tr><td>기관 A 정책 발표<small>가상 기사 E01</small></td><td>${badge('후보 채택','green')}</td><td>확정 정책·업종 관련성</td></tr><tr><td>같은 발표 재인용<small>가상 기사 E02</small></td><td>${badge('중복')}</td><td>같은 사건·새 사실 없음</td></tr><tr><td>기관 B 가격 전망<small>가상 기사 E03</small></td><td>${badge('제외')}</td><td>확정 사건 없는 전망</td></tr></tbody></table></div>`:'<dl class="kv"><dt>대상 심볼</dt><dd>^GSPC · ^NDX</dd><dt>미국 거래일</dt><dd>2026-11-03 · 가상 표시</dd><dt>검사</dt><dd>같은 완료 거래일 · 전 거래일 비교 · 출처/수집시각</dd></dl>'}<div class="callout neutral">complete는 선언한 질의·수집 구간의 완주입니다. 세상의 모든 뉴스를 확보했다는 뜻이 아닙니다.</div></section>`;}
function operations(){let body=operationTab==='runs'?`<ol class="timeline"><li><time>07:00</time><strong>아침 수집 · 완료</strong><small>조회 범위·완료 커서 확인</small></li><li><time>07:43</time><strong>편성 준비 · 완료</strong><small>v3 · 검토 대기</small></li><li><time>08:00 목표</time><strong>게시 worker · 예약 대기</strong><small>전체 가상 실행 이력</small></li></ol>`:operationTab==='alerts'?`<h2>게시 응답 불명</h2><div class="callout">원인: 외부 응답 timeout · 해당 편성 중단 · 운영자 대조 필요</div><dl class="kv"><dt>Telegram</dt><dd>발신 실패 · 모의 3회 시도</dd><dt>중복 억제</dt><dd>같은 장애는 열린 동안 추가 발신 억제</dd><dt>안내</dt><dd>알림 실패로 게시 차단을 해제하지 않음</dd></dl>`:`<dl class="kv"><dt>확정 관측액</dt><dd>10,000원 · 가상</dd><dt>예약액</dt><dd>2,400원 · 가상</dd><dt>추가 예상액</dt><dd>1,800원 · 예약/확정과 별도</dd><dt>월 상한</dt><dd>50,000원</dd><dt>마지막 관측</dt><dd>11/4 07:48 · 계정 전체 청구액 아님</dd></dl>`;
return title('OPERATIONS','운영 현황','후속 · 실행과 장애의 원인, 관측한 비용을 확인합니다.',badge('2단계'))+`<div class="tabs" aria-label="운영 정보">${[['runs','실행 이력'],['alerts','장애·알림'],['cost','사용량·비용']].map(([id,label])=>`<button data-operation="${id}" aria-pressed="${operationTab===id}">${label}</button>`).join('')}</div><section class="panel">${body}</section>`;}
function settings(){return title('CONFIGURATION','설정','후속 · 현재 운영 조건을 읽기 전용으로 확인합니다.',badge('2단계 · 조회 전용'))+`<div class="two"><section class="panel"><h2>편성·운영 조건</h2><dl class="kv"><dt>모드</dt><dd>reviewed · 운영자 검토</dd><dt>아침</dt><dd>08:00 목표 / 09:00 마감</dd><dt>저녁</dt><dd>18:00 목표 / 18:10 마감</dd><dt>게시 상한</dt><dd>아침 최대 3글 / 저녁 최대 2글</dd><dt>월 비용 상한</dt><dd>50,000원</dd></dl></section><section class="panel"><h2>연결 상태 표시 예시</h2><dl class="kv"><dt>Google</dt><dd>로그인 확인 · 가상 상태</dd><dt>뉴스 제공처</dt><dd>설정됨 · 이용 범위 검증 대기</dd><dt>X</dt><dd>실제 쓰기 권한 확인 대기</dd><dt>Telegram</dt><dd>연결 확인 대기</dd></dl><div class="callout neutral">설정됨과 실제 연결 성공을 구분합니다. 키·토큰·DB 접속 문자열은 화면에 노출하지 않습니다.</div></section></div>`;}
function render(){const views={dashboard,reviews:reviewList,'review-detail':reviewDetail,publications,'publication-detail':()=>publicationDetail(false),'publication-success':()=>publicationDetail(true),collections,operations,settings};root.innerHTML=views[page]();document.querySelectorAll('[data-page]').forEach(el=>{if(el.closest('.nav')){const active=el.dataset.page===(page.startsWith('review')?'reviews':page.startsWith('publication')?'publications':page);el.classList.toggle('active',active);if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');}});}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.page){page=el.dataset.page;toast.hidden=true;render();return;}if(el.dataset.collection){collectionTab=el.dataset.collection;render();return;}if(el.dataset.operation){operationTab=el.dataset.operation;render();return;}const action=el.dataset.action;if(action==='approve'){state='scheduled';render();notice('화면 시연: v3 전체를 예약 상태로 표시했습니다. 실제 승인·전송은 없습니다.');}if(action==='hold'){const reason=document.getElementById('hold-reason');if(!reason.value.trim()){notice('화면 시연: 보류 사유를 입력해 주세요.');reason.focus();return;}state='held';render();notice('화면 시연: 편성 전체가 보류되었습니다. 입력 사유는 외부로 전송하거나 저장하지 않습니다.');}if(action==='refresh'){notice('가상 자료를 다시 표시했습니다. 서버에 요청하지 않았습니다.');}if(action==='filter'){const date=document.getElementById('review-date').value,edition=document.getElementById('review-edition').value,status=document.getElementById('review-status').value;document.getElementById('review-rows').innerHTML=date==='2026-11-04'&&edition!=='PM'&&(status==='all'||status===state)?reviewRows():'<div class="empty">조건에 맞는 가상 편성이 없습니다.<br>빈 목록은 수집 성공을 뜻하지 않습니다.</div>';}});
document.addEventListener('change',e=>{if(e.target.id==='scenario'){state=e.target.value;render();toast.hidden=true;}});
render();
})();
</script>
</body></html>
